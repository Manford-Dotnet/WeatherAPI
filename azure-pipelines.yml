# ASP.NET Core (.NET Framework)
# Build and test ASP.NET Core projects targeting the full .NET Framework.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
- main

pool:
  name: 'Default'

steps:

- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '8.0.404'

- task: DotNetCoreCLI@2
  displayName: 'Restore'
  inputs:
    command: 'restore'
    projects: '**/*.csproj'

- task: DotNetCoreCLI@2
  displayName: 'Build'
  inputs:
    command: 'build'
    projects: '**/*.csproj'
    arguments: '--configuration Release'

- task: DotNetCoreCLI@2
  displayName: 'Test'
  inputs:
    command: 'test'
    projects: '**/*Tests.csproj'
    arguments: '--configuration Release'

- powershell: |
    Import-Module WebAdministration
    Stop-WebAppPool -Name "WeatherAPI"
  displayName: 'Stop App Pool'

- powershell: |
    dotnet publish "$(Build.SourcesDirectory)\GetWeatherAPI.csproj" `
      -c Release `
      -o "C:\inetpub\wwwroot\WeatherAPI"
  displayName: 'Publish To IIS'

- powershell: |
    Import-Module WebAdministration
    Start-WebAppPool -Name "WeatherAPI"
  displayName: 'Start App Pool'